apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: shop
  labels:
    app: stranger
    owner: kazantsev
spec:
  restartPolicy: Never
  containers:
    - name: intruder
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"