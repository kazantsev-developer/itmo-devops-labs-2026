apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.high.name }}
  labels:
    owner: {{ .Values.global.owner }}
value: {{ .Values.priorityClasses.high.value }}
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Гриффиндор: api и postgres. Критический путь, не уступает место никому."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.medium.name }}
  labels:
    owner: {{ .Values.global.owner }}
value: {{ .Values.priorityClasses.medium.value }}
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Пуффендуй: worker. Средний приоритет, уступает только Гриффиндору."