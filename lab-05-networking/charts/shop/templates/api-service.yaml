apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-server
    owner: {{ .Values.global.owner }}
spec:
  type: {{ .Values.api.service.type | default "ClusterIP" }}
  selector:
    app: api-server
  ports:
    - name: http-web
      port: {{ .Values.api.port }}
      targetPort: http-web
      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: 30080
      {{- end }}