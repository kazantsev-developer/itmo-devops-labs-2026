{{- if .Values.networkPolicy.enabled }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    owner: {{ .Values.global.owner }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Release.Namespace }}
  labels:
    owner: {{ .Values.global.owner }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace }}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.dns.port }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.dns.port }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    owner: {{ .Values.global.owner }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicy.api.labels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.api.port }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    owner: {{ .Values.global.owner }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicy.postgres.labels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.api.labels | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.worker.labels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.port }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    owner: {{ .Values.global.owner }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - {{ .Values.networkPolicy.api.labels.app | quote }}
          - {{ .Values.networkPolicy.worker.labels.app | quote }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.postgres.labels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.port }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    owner: {{ .Values.global.owner }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicy.postgres.labels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.cnpg.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.monitorPort }}

{{- end }}