global:
  owner: kazantsev

monitoring:
  enabled: true

networkPolicy:
  enabled: false

otel:
  endpoint: ""

spread:
  mode: topologySpread

api:
  replicas: 3
  image: "shop-api:1.0.2"
  imagePullPolicy: Never
  port: 8080
  healthFail: "false"
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: "134m"
      memory: "100Mi"
    limits:
      cpu: "134m"
      memory: "100Mi"

worker:
  replicas: 2
  image: "shop-worker:1.0.0"
  imagePullPolicy: Never
  port: 8081
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

priorityClasses:
  high:
    name: shop-critical
    value: 1000000
  medium:
    name: shop-normal
    value: 500000

podDisruptionBudget:
  api:
    minAvailable: 2
  postgres:
    minAvailable: 1

postgres:
  host: "shop-postgres-rw.shop.svc.cluster.local"
  port: 5432
  user: "app"
  password: "app-password"
  database: "app"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"