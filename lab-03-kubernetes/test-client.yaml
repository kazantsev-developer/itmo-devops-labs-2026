apiVersion: v1
kind: Pod
metadata:
  name: curl-test
  namespace: shop
  labels:
    app: curl-test
    owner: kazantsev
spec:
  restartPolicy: Never
  containers:
    - name: curl-test
      image: docker.io/library/busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            code=$(wget -q -S -O /dev/null http://api.shop.svc.cluster.local:8080/health 2>&1 | grep HTTP | awk '{print $2}')
            echo "$(date +%H:%M:%S) - $code"
            sleep 0.5
          done
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "50m"
          memory: "64Mi"
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
