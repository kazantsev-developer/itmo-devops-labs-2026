global:
  owner: kazantsev

otel:
  endpoint: "http://jaeger.monitoring.svc.cluster.local:4318"

api:
  # Тест отката: healthFail=true ломает readiness, rollout зависает
  replicas: 3
  image: "shop-api:1.0.1"
  imagePullPolicy: Never
  port: 8080
  healthFail: "true"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

worker:
  replicas: 2
  image: "shop-worker:1.0.0"
  imagePullPolicy: Never
  port: 8081
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

postgres:
  host: "shop-postgres-rw.shop.svc.cluster.local"
  port: 5432
  user: "app"
  password: "app-password"
  database: "app"
