apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker
    owner: {{ .Values.global.owner }}
spec:
  type: ClusterIP
  selector:
    app: worker
  ports:
    - name: http-health
      port: {{ .Values.worker.port }}
      targetPort: http-health
