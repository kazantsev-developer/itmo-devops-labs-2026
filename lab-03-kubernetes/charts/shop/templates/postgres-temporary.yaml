apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: shop-postgres
    owner: {{ .Values.global.owner }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-postgres
  template:
    metadata:
      labels:
        app: shop-postgres
        owner: {{ .Values.global.owner }}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shop-postgres-rw
  namespace: {{ .Release.Namespace }}
  labels:
    app: shop-postgres
    owner: {{ .Values.global.owner }}
spec:
  type: ClusterIP
  selector:
    app: shop-postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres