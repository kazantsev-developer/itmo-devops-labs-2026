apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: n8n-rules
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  groups:
    - name: n8n.rules
      rules:
        - alert: N8nWorkflowSlow
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(n8n_workflow_execution_duration_seconds_bucket[5m]))
            ) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "УЛИТКА-ТАЙМ: детектив Гофер застрял на допросе (>30s p95)"
            description: "Расследование буксует. p95 выполнения воркфлоу за 5 минут: {{ $value | humanizeDuration }}. Либо OpenRouter тянет с ответом, либо MCP-сервер ушел в запой, либо модель снова начала философствовать вместо вызова инструментов."

        - alert: N8nWorkflowFailing
          expr: |
            rate(n8n_workflow_execution_duration_seconds_count{status="failed"}[5m]) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ПРОВАЛ ОПЕРАЦИИ: дело Гофера сыпется на глазах"
            description: "Агент падает с ошибками. Доля фейлов за 5 минут: {{ $value | humanize }} оп/сек. Хватай Execution Log в n8n и читай, что там: rate limit от OpenRouter, timeout MCP или парсер подавился JSON-ответом модели."

        - alert: N8nHighMemory
          expr: |
            n8n_process_resident_memory_bytes > 800 * 1024 * 1024
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "АМНЕЗИЯ: n8n распух до неприличия (>800 МБ RSS)"
            description: "Детектив помнит слишком много улик. RSS процесса: {{ $value | humanize1024 }}. Возможная утечка или накопление контекста агента между запусками. Проверь n8n_nodejs_heap_size_used_bytes — если растет монотонно, пора перезапускать контейнер."
