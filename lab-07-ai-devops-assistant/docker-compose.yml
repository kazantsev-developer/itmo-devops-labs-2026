services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-detective
    ports:
      - "5678:5678"
    volumes:
      - ./mock-data:/data/mock-data
      - ./output:/data/output
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/London
      - N8N_SECURE_COOKIE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/mock-data;/data/output
      - N8N_METRICS=true
    restart: unless-stopped

  mcp-filesystem:
    image: node:20-alpine
    container_name: mcp-filesystem
    working_dir: /app
    command: >
      sh -c "npx -y supergateway
      --stdio 'npx -y @modelcontextprotocol/server-filesystem /data/mock-data /data/output'
      --port 3001
      --baseUrl http://mcp-filesystem:3001
      --ssePath /sse
      --messagePath /message"
    ports:
      - "3001:3001"
    volumes:
      - ./mock-data:/data/mock-data
      - ./output:/data/output
    restart: unless-stopped

  mcp-memory:
    image: node:20-alpine
    container_name: mcp-memory
    working_dir: /app
    command: >
      sh -c "npx -y supergateway
      --stdio 'npx -y @modelcontextprotocol/server-memory'
      --port 3002
      --baseUrl http://mcp-memory:3002
      --ssePath /sse
      --messagePath /message"
    ports:
      - "3002:3002"
    restart: unless-stopped

volumes:
  n8n_data:
