services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-detective
    ports:
      - "5678:5678"
    volumes:
      - ./mock-data:/data/mock-data
      - ./output:/data/output
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/London
      - N8N_SECURE_COOKIE=false
    restart: unless-stopped

volumes:
  n8n_data:
