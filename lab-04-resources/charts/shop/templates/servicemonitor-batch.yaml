{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop-batch
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prom
    app: shop-batch
    owner: {{ .Values.global.owner }}
spec:
  selector:
    matchLabels:
      app: shop-batch
  endpoints:
    - port: http-health
      path: /metrics
      interval: 15s
{{- end }}