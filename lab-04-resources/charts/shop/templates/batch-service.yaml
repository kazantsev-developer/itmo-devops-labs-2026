apiVersion: v1
kind: Service
metadata:
  name: batch
  namespace: {{ .Release.Namespace }}
  labels:
    app: shop-batch
    owner: {{ .Values.global.owner }}
spec:
  type: ClusterIP
  selector:
    app: shop-batch
  ports:
    - name: http-health
      port: {{ .Values.batch.port }}
      targetPort: http-health