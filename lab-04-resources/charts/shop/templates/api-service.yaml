apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-server
    owner: {{ .Values.global.owner }}
spec:
  type: ClusterIP
  selector:
    app: api-server
  ports:
    - name: http-web
      port: {{ .Values.api.port }}
      targetPort: http-web
