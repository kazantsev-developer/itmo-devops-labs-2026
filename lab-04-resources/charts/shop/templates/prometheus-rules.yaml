apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-api-rules
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prom
spec:
  groups:
    - name: shop.resource.rules
      rules:
        - alert: ContainerHighCPUThrottling
          expr: |
            (
              sum by (pod, namespace) (
                rate(container_cpu_cfs_throttled_periods_total{namespace="shop", container!=""}[5m])
              )
              /
              sum by (pod, namespace) (
                rate(container_cpu_cfs_periods_total{namespace="shop", container!=""}[5m])
              )
            ) > 0.25
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Контейнер {{ "{{ $labels.pod }}" }} заторможен CPU throttling"
            description: "Больше 25% времени контейнер {{ "{{ $labels.pod }}" }} в namespace {{ "{{ $labels.namespace }}" }} стоит на паузе из-за упора в CPU limit. Текущее значение: {{ "{{ $value | humanizePercentage }}" }}."

        - alert: NodeMemoryPressure
          expr: |
            kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Нода {{ "{{ $labels.node }}" }} в давлении по памяти"
            description: "Kubelet на ноде {{ "{{ $labels.node }}" }} сообщает MemoryPressure. Следующий шаг - eviction подов. Проверь, какие поды жрут память, и при необходимости добавь ресурсов."

        - alert: PodEvicted
          expr: |
            kube_pod_status_reason{reason="Evicted"} > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Под {{ "{{ $labels.pod }}" }} выселен с ноды"
            description: "Под {{ "{{ $labels.pod }}" }} в namespace {{ "{{ $labels.namespace }}" }} выселен kubelet'ом из-за давления на ноду. Проверь QoS-класс и priorityClass пода - жертвой стал самый незащищённый."