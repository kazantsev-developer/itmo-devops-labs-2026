{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-api-rules
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prom
spec:
  groups:
    - name: shop.resource.rules
      rules:
        - alert: CriticalPodPending
          expr: |
            kube_pod_status_phase{namespace="shop", phase="Pending"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "ДРОГОН КРУЖИТ: {{ "{{ $labels.pod }}" }} застрял в Pending"
            description: "Под {{ "{{ $labels.pod }}" }} в namespace {{ "{{ $labels.namespace }}" }} висит в Pending больше минуты. Великий Механический Десница не нашёл ему места ни на одной ноде. Смотри, кто это - если лорд из касты shop-critical, критический путь в осаде. Если одичалый shop-batch - просто голод за Стеной."

        - alert: HighOrderLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{namespace="shop", path="/order"}[5m])) by (le)
            ) > 0.3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "РЕЙГАЛЬ ЧУЕТ ЛАГ: критический путь тормозит"
            description: "95-й перцентиль задержки POST /order в namespace {{ "{{ $labels.namespace }}" }} пробил отметку 300 мс и держится больше двух минут. Текущее значение: {{ "{{ $value | humanizeDuration }}" }}. Королевский SLA нарушен, северный род api спотыкается под осадой. Пора искать, кто сожрал такты процессора."

        - alert: BatchEvictionAlert
          expr: |
            (
              kube_deployment_spec_replicas{namespace="shop", deployment="batch"}
              -
              kube_deployment_status_replicas_ready{namespace="shop", deployment="batch"}
            ) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "ВИЗАРИОН ПАЛ: одичалые деградируют"
            description: "Желаемое число реплик batch больше, чем поднятых. Разница: {{ "{{ $value }}" }}. Кubelet рубит одичалых под давлением или они в Pending. Критический путь не тронут - горит только ночная аналитика за Стеной."
{{- end }}