global:
  owner: kazantsev

otel:
  endpoint: ""

spread:
  mode: topologySpread

api:
  replicas: 3
  image: "shop-api:1.0.2"
  imagePullPolicy: Never
  port: 8080
  healthFail: "false"
  resources:
    requests:
      cpu: "134m"
      memory: "100Mi"
    limits:
      memory: "100Mi"

worker:
  replicas: 2
  image: "shop-worker:1.0.0"
  imagePullPolicy: Never
  port: 8081
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

batch:
  replicas: 1
  image: "shop-batch:1.0.0"
  imagePullPolicy: Never
  port: 8082
  cpuLoad: 1
  memLoadMB: 32
  memInterval: "5s"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"

priorityClasses:
  high:
    name: shop-critical
    value: 1000000
  medium:
    name: shop-normal
    value: 500000
  low:
    name: shop-batch
    value: 1000

podDisruptionBudget:
  api:
    minAvailable: 2
  postgres:
    minAvailable: 1

postgres:
  host: "shop-postgres-rw.shop.svc.cluster.local"
  port: 5432
  user: "app"
  password: "app-password"
  database: "app"
