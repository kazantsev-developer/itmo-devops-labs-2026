apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-red
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  red-dashboard.json: |-
    {
      "title": "RED — api-service",
      "uid": "api-service-red",
      "tags": ["api-service", "red"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "RPS - интенсивность запросов",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{job=\"api-service\", path!=\"/metrics\"}[1m]))",
              "legendFormat": "RPS"
            }
          ]
        },
        {
          "id": 2,
          "title": "Доля ошибок 5xx (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{job=\"api-service\", path!=\"/metrics\", status=~\"5..\"}[1m])) / sum(rate(http_requests_total{job=\"api-service\", path!=\"/metrics\"}[1m])) * 100",
              "legendFormat": "5xx %"
            }
          ]
        },
        {
          "id": 3,
          "title": "Время ответа p95 (сек)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "s", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"api-service\", path!=\"/metrics\"}[5m])))",
              "legendFormat": "p95"
            }
          ]
        }
      ]
    }
