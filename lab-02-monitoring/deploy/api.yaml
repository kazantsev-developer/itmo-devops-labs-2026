apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: monitoring
  labels:
    app: api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api
          image: api-slim:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http-web
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger.monitoring.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "api-service"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: monitoring
  labels:
    app: api-server
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http-web
  selector:
    app: api-server
